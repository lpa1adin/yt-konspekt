# Необязательный файл настроек. Скопируйте в папку данных приложения как config.toml:
#   macOS:   ~/Library/Application Support/yt-konspekt/config.toml
#   Linux:   ~/.local/share/yt-konspekt/config.toml
#   Windows: %LOCALAPPDATA%\yt-konspekt\config.toml
# Порядок: значения по умолчанию → этот файл → экран «Настройки» → параметры задачи.

output_dir = "~/Documents/Конспекты"
format = "docx"              # md | docx | pages (pages — только macOS)
auto_export = true
filename_template = "{title}" # {title} {channel} {date} {id}; «/» — подпапка
language = "ru"
detail = "full"              # full | short
keep_audio = false
cookies_from_browser = ""    # safari | chrome | firefox — если YouTube просит войти

[llm]
# backend: ollama | openai (любой OpenAI-совместимый API) | anthropic (Claude)
#   Ollama:     backend = "ollama",    base_url = "http://localhost:11434"
#   LM Studio:  backend = "openai",    base_url = "http://localhost:1234/v1"
#   Claude:     backend = "anthropic", base_url = "https://api.anthropic.com",  model = "claude-opus-5-5"
#   ChatGPT:    backend = "openai",    base_url = "https://api.openai.com/v1",  model = "gpt-5-mini"
#   Gemini:     backend = "openai",    base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
#   OpenRouter: backend = "openai",    base_url = "https://openrouter.ai/api/v1"
# Ключи API сюда не пишите: вставьте их в «Настройки → Модель» или задайте переменными окружения
# ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY, OPENROUTER_API_KEY, DEEPSEEK_API_KEY, MISTRAL_API_KEY.
backend = "ollama"
model = "qwen3:8b"
base_url = "http://localhost:11434"
num_ctx = 16384              # только Ollama
temperature = 0.3            # Claude не использует
chunk_chars = 18000
effort = "medium"            # только Claude: low | medium | high

[whisper]
engine = "auto"              # auto | mlx | faster
model = "large-v3-turbo"     # medium, small — быстрее
language = ""

[subtitles]
use = true
langs = ["ru", "en"]
