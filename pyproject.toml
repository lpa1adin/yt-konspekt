[project]
name = "yt-konspekt"
version = "0.1.0"
description = "Веб-приложение: ссылка на YouTube → конспект (Whisper + Ollama или облачная LLM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
    "markdown-it-py>=3.0",
    "platformdirs>=4.0",
    "yt-dlp[default]>=2025.11.12",  # [default] = yt-dlp-ejs для YouTube
    "anthropic>=1,<2",  # Claude API; для локальных моделей не используется
    "python-docx>=1.1",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
window = ["pywebview>=5"]
faster = ["faster-whisper>=1.0"]

[project.scripts]
yt-konspekt = "app.main:run"
yt-konspekt-cli = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.md", "templates/*.html", "templates/partials/*.html", "static/css/*", "static/js/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
